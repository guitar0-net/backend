# Full dependency audit. Pull requests only fail on vulnerabilities they introduce,
# so advisories published against what is already on main surface here instead.
name: Security audit

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: pip-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up PDM with cache
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.14"
          version: "2.29.2"
          cache: true
          cache-dependency-path: |
            pdm.lock
            pyproject.toml

      - name: Install dependencies
        run: pdm install --frozen-lockfile

      - name: pip-audit — all locked dependencies
        run: pdm run audit
