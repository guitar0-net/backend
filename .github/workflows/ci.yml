name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up PDM with cache
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: ${{ matrix.python-version }}
          version: "2.29.2"
          cache: true
          cache-dependency-path: |
            pdm.lock
            pyproject.toml

      - name: Install dependencies
        run: pdm install --frozen-lockfile

      - name: Ruff — format check
        run: pdm run ruff format --check .

      - name: Ruff — lint checks
        run: pdm run ruff check --no-fix .

      - name: REUSE — license header compliance
        run: pdm run license-check

  typecheck:
    name: Mypy type checking
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    env:
      SECRET_KEY: "dummy-secret-key"
      DATABASE_URL: "sqlite:///test.db"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up PDM with cache
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: ${{ matrix.python-version }}
          version: "2.29.2"
          cache: true
          cache-dependency-path: |
            pdm.lock
            pyproject.toml

      - name: Install dependencies
        run: pdm install --frozen-lockfile

      - name: Run MyPy
        run: pdm run mypy --strict .

  tests:
    name: Pytest + Coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    env:
      SECRET_KEY: "dummy-secret-key"
      DATABASE_URL: "sqlite:///test.db"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up PDM with cache
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: ${{ matrix.python-version }}
          version: "2.29.2"
          cache: true
          cache-dependency-path: |
            pdm.lock
            pyproject.toml

      - name: Install dependencies
        run: pdm install --frozen-lockfile

      - name: Install WeasyPrint system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libpangocairo-1.0-0 \
            libcairo2 libgdk-pixbuf-2.0-0 shared-mime-info fonts-liberation

      - name: Django — system checks
        run: pdm run python manage.py check

      - name: Django — no missing migrations
        run: pdm run python manage.py makemigrations --check --dry-run

      - name: Run unit tests
        run: pdm run pytest --maxfail=1 --cov --cov-branch --cov-report=xml --cov-fail-under=90 -m "not integration"

      - name: Run integration tests
        run: pdm run pytest --maxfail=1 --cov --cov-branch --cov-report=xml --cov-append -m "integration"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: guitar0-net/server
          files: coverage.xml

  security:
    name: Security checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up PDM with cache
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.14"
          version: "2.29.2"
          cache: true
          cache-dependency-path: |
            pdm.lock
            pyproject.toml

      - name: Install dependencies
        run: pdm install --frozen-lockfile

      - name: Bandit — SAST scan
        id: bandit
        run: pdm run bandit -c pyproject.toml -ll -r . -f sarif -o bandit.sarif
        continue-on-error: true

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: bandit.sarif

      - name: Fail if Bandit found issues
        if: steps.bandit.outcome == 'failure'
        run: exit 1

      - name: Checkout base branch lock file
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .audit-base
          sparse-checkout: |
            pyproject.toml
            pdm.lock
          sparse-checkout-cone-mode: false

      # pip-audit exits 1 whenever it finds anything, including advisories already on
      # main; audit_diff.py decides, and fails on a missing report if pip-audit crashed.
      - name: pip-audit — vulnerabilities introduced by this PR
        run: |
          pdm export --no-hashes -p .audit-base -o "$RUNNER_TEMP/base.txt"
          pdm export --no-hashes -o "$RUNNER_TEMP/head.txt"
          for side in base head; do
            pdm run pip-audit -r "$RUNNER_TEMP/$side.txt" --no-deps --disable-pip \
              -f json -o "$RUNNER_TEMP/$side.json" || true
          done
          pdm run python scripts/audit_diff.py "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json"

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, tests, security]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          pull: true
          push: false
          tags: kotlyar562/guitar0net:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
